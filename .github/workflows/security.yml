name: security

# Server-side security gate. The repo already had a local pre-push gitleaks
# hook, but a hook only protects the maintainer's machine — a fresh clone, a
# fork, or a PR from anyone else has no such gate. This moves secret scanning
# and workflow linting to CI, where they run on every push and pull request and
# nobody can forget to install them.
#
# CONVERT-TO-REUSABLE: to centralise this across repos later (option A), replace
# the `on:` block below with:
#     on:
#       workflow_call:
# and call it from each repo with a 6-line stub:
#     jobs:
#       security:
#         uses: prasannavarshan/ci/.github/workflows/security.yml@<sha>
# Nothing else in this file needs to change.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Deny by default; each job takes only what it needs. Matches tests.yml.
permissions: {}

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks needs history to scan the full commit range on push, not
          # just the tip. fetch-depth 0 gets every commit; without it the action
          # scans only the checkout and misses secrets introduced earlier.
          fetch-depth: 0

      # Pinned by commit SHA, not tag: a tag can be moved to point at new code,
      # a SHA cannot. This is the same discipline update-toolchain applies to
      # the tools it updates.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0

  workflows:
    name: workflow lint (actionlint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # actionlint is fetched as a pinned release binary and its checksum is
      # verified before it runs — the same "verify what you pulled down" stance
      # the README takes toward every other tool. This avoids adding a second
      # third-party action to the trusted set just to lint the first one.
      - name: Install actionlint (pinned + checksum-verified)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          # sha256 of actionlint_1.7.12_linux_amd64.tar.gz, from the release
          # checksums.txt. Bump both together when Dependabot proposes a new
          # version; a mismatch fails the job rather than running unknown code.
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          file="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$file" "${base}/${file}"
          echo "${ACTIONLINT_SHA256}  ${file}" | sha256sum -c -
          tar -xzf "$file" actionlint
          chmod +x actionlint

      - name: actionlint
        run: ./actionlint -color
